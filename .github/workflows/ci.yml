name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: 分析引擎 · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: pip install -e "engine[dev]"
      - run: pytest -q
        working-directory: engine

  web:
    name: 前端 · 类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  server:
    name: 业务服务 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -q verify
        working-directory: server

  e2e:
    name: 端到端回归(10 个套件)
    runs-on: ubuntu-latest
    needs: [engine, web, server]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dpub, POSTGRES_PASSWORD: dpub, POSTGRES_DB: dpub }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dpub" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: dpub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: pip install -e "engine[dev]"
      - run: mvn -B -q package -DskipTests
        working-directory: server
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: scripts/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-logs, path: /tmp/dpub-e2e }
