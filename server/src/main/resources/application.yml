server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: chs-dpub-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dpub}
    username: ${DB_USER:dpub}
    password: ${DB_PASSWORD:dpub}
    hikari:
      maximum-pool-size: 12
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  engine:
    url: ${ENGINE_URL:http://localhost:8091}
    connect-timeout-ms: 2000
    read-timeout-ms: 30000
  jwt:
    # 生产环境必须通过环境变量 JWT_SECRET 提供（≥32 字符），否则拒绝启动
    secret: ${JWT_SECRET:}
    ttl-hours: 12
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # 演示模式：基础配置一律关闭，仅 application-dev.yml 开启
  demo:
    enabled: false
    sms-code: ""
  security:
    login-max-failures: 5
    login-lock-minutes: 15
  # 水印与时间显示时区
  zone: Asia/Shanghai

logging:
  level:
    gov.ybj.chsdpub: INFO
