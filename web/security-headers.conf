# 安全响应头（nginx.conf 各 location 通过 include 引入：location 内一旦有 add_header 就不再继承 server 级的 add_header）。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 基本 CSP：脚本只允许同源（构建产物无内联脚本）；样式允许内联（Vue :style 绑定、组件库与文书 srcdoc 预览的内联样式）；
# 字体 / 图片允许 data:，导出下载用 blob: 链接；文书预览为 sandbox 的 srcdoc iframe；禁止被其他站点嵌入。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
